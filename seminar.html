<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Snow Choi의 세미나 자료 목록 및 발표/읽기용 문서">

    <title>Seminars — Snow Choi</title>
    <link rel="stylesheet" href="./styles/style.css">

    <!-- Client-side Direct PDF Generation Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  </head>

  <body>
    <header>
      <a href="./index.html">Snow Choi</a>

      <nav aria-label="주요 메뉴">
        <a href="./index.html">About</a>
        <a href="./seminar.html" aria-current="page">Seminars</a>
      </nav>
    </header>

    <main class="seminars">
      <header>
        <h1>Seminars</h1>
        <p>강의 및 연구 세미나 자료입니다. 체계적인 학습을 위한 **세로 문서(읽기용)**와 현장 발표를 위한 **가로 슬라이드**로 구분되어 제공됩니다. 각 항목 옆의 [📥] 아이콘을 누르면 탭 열림 없이 바로 PDF 파일로 다운로드됩니다.</p>
      </header>

      <!-- Dynamic Data-Driven Seminar List Section -->
      <section id="seminar-list-container" class="seminar-list" aria-label="세미나 자료 목록">
      </section>
    </main>

    <script type="module">
      import { renderSeminarList } from "./components/level3-seminar-page/seminar-list-renderer.js";
      document.addEventListener("DOMContentLoaded", () => {
        renderSeminarList(document.getElementById("seminar-list-container"));
      });
    </script>
  </body>
</html>
