<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세미나 — 발표용 슬라이드</title>
    <link rel="stylesheet" href="../styles/style.css">
  </head>
  <body>
    <!-- Top Control Header Component -->
    <slide-header id="main-slide-header"></slide-header>

    <!-- Horizontal Slide Presentation Main View Container -->
    <main class="slide-wrapper">
      <div id="slides-container" class="slide-container horizontal">
        <!-- Rendered dynamically by slide-renderer.js template engine -->
      </div>
    </main>

    <script type="module" src="../components/slide-header.js"></script>
    <script type="module">
      import { seminarsDatabase } from "../data/seminars.js";
      import { renderPresentationSlides } from "../components/level4-presentation/slide-renderer.js";
      import { PresentationController } from "../components/level4-presentation/presentation-controller.js";

      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const topicId = params.get("topic") || "python-intro";
        const shouldPrint = params.get("print") === "true";
        const topicData = seminarsDatabase[topicId] || seminarsDatabase["python-intro"];

        // Update Document Title
        document.title = `${topicData.title} — 발표용 슬라이드`;

        // Update Header Component Attributes
        const headerEl = document.getElementById("main-slide-header");
        if (headerEl) {
          headerEl.setAttribute("title", topicData.title);
          headerEl.setAttribute("badge", "발표용 슬라이드");
          headerEl.setAttribute("alt-href", `./viewer-vertical.html?topic=${topicId}`);
          headerEl.setAttribute("alt-text", "읽기용 문서 ↗");
          headerEl.setAttribute("is-presentation", "true");
        }

        // Render Slides Template
        const container = document.getElementById("slides-container");
        renderPresentationSlides(container, topicData);

        // Initialize Presentation Controller
        new PresentationController();

        // Auto trigger PDF print dialog if requested from Seminar page PDF icon
        if (shouldPrint) {
          setTimeout(() => {
            window.print();
          }, 350);
        }
      });
    </script>
  </body>
</html>
