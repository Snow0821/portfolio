<html>

    <body>
        <h1>나의 작은 챗봇</h1>
        <a href="newpage.html">링크</a>

        <div>
            <p id = "chat"></p>
            <input value = 1 id = "input">
            <button onclick="send()">전송</button>
        </div>
        <script>
            function send(){
                const text = document.querySelector("#input")
                const chat = document.querySelector("#chat")

                chat.innerHTML += text.value
            }
        </script>
    </body>
</html>
